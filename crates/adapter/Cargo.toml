[package]
name = "adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Maps device data into the sim's observation schema over SNMP and TFTP, and pseudonymizes it at ingest."

[dependencies]
pnm-wire = { path = "../pnm-wire" }
schema = { path = "../schema" }
sim = { path = "../sim" }
hmac = "0.12"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
emulator = { path = "../emulator" }
plant-graph = { path = "../plant-graph" }
features = { path = "../features" }
diagnosis = { path = "../diagnosis" }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
