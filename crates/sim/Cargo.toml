[package]
name = "sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "The physics simulation: what a real plant would measure, computed from the plant graph."

[dependencies]
schema = { path = "../schema" }
plant-graph = { path = "../plant-graph" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
