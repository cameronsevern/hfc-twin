[package]
name = "twin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "The twin's operations over plant graph, sim and diagnosis. The MCP server is its only API."

[dependencies]
schema = { path = "../schema" }
plant-graph = { path = "../plant-graph" }
sim = { path = "../sim" }
features = { path = "../features" }
diagnosis = { path = "../diagnosis" }
design = { path = "../design" }
ops = { path = "../ops" }
uuid = "1"
proposal = { path = "../proposal" }
sha2 = "0.10"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

