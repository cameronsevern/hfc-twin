[package]
name = "schema"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "The seven data contracts every hfc-twin crate reads."

[features]
# Rewrites fixtures/schemas/ instead of asserting it is unchanged.
regen = []

[dependencies]
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v5"] }
