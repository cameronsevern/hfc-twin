[package]
name = "features"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "The feature layer: a pure function of observation, plant and profile, and the sweep that labels it."

[dependencies]
schema = { path = "../schema" }
