[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cameronsevern/hfc-twin"
authors = ["Cameron Severn"]
publish = false

# The sim is numeric, and its tests walk many frequencies.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
