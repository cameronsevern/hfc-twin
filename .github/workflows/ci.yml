name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin-ci-only
          POSTGRES_DB: twin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twin"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HFC_TEST_DATABASE_URL: postgres://twin:twin-ci-only@localhost:5432/twin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release
